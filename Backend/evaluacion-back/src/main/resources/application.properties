spring.application.name=permisos

# URL con los parámetros obligatorios de cifrado para el driver moderno
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=permisos_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.port=8080