<div style="max-width: 400px; margin: 80px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: sans-serif;">
  <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Sistema de Permisos</h2>
  
  @if (errorMessage) {
    <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
      ⚠️ {{ errorMessage }}
    </div>
  }

  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Correo Electrónico:</label>
      <input 
        type="email" 
        [(ngModel)]="correo" 
        name="correo" 
        placeholder="ejemplo@correo.com"
        style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"
        [disabled]="loading"
      />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #555;">Contraseña:</label>
      <input 
        type="password" 
        [(ngModel)]="contrasena" 
        name="contrasena" 
        placeholder="********"
        style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"
        [disabled]="loading"
      />
    </div>

    <button 
      type="submit" 
      [disabled]="loading"
      style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;"
    >
      {{ loading ? 'Autenticando...' : 'Iniciar Sesión' }}
    </button>
  </form>
</div>
